version: 2.1

jobs:
  bootstrap_fix-parse-crash:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: color mode
          command: |
            mkdir -p /tmp/scratch
            set +o pipefail 2>/dev/null; seq 1 797538 | md5sum > /tmp/scratch/log.txt; true
            echo "baseline emitted ($(wc -l </tmp/scratch/log.txt) lines)"
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - log.txt
  fix-parse-crash:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Read handoff file
          command: |
            { head -n 5 /tmp/scratch/log.txt > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Fetch artifact
          command: git clone --depth 3 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract archive
          command: cat files.tgz | tar xzf -
      - run:
          no_output_timeout: 62m
          command: taskset -c 0-3 ./bootstrap
  vendor_helios-beta:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
